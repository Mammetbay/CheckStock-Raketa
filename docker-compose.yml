services:
  db:
    image: postgres:16-alpine
    container_name: checkstock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    ports:
      - "5432:5432"
    volumes:
      - checkstock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: checkstock-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock
    ports:
      - "8000:8000"

volumes:
  checkstock_pgdata:
